<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../Assets/img/logo.ico" type="image/x-icon">
<title>Garbosa System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<link rel="stylesheet" href="css/sistema.css">
</head>
<body class="app-body">

<div id="loading" class="loading-screen">
  <img src="../Assets/img/logo.ico" alt="">
  <div class="spinner"></div>
  <p>Carregando o sistema...</p>
</div>

<div id="app" class="app hidden">
  <header class="topbar">
    <div class="topbar-left">
      <img src="../Assets/img/logo.ico" alt="Garbosa" class="topbar-logo">
      <div>
        <strong>Garbosa System</strong>
        <small id="userEmpresa"></small>
      </div>
    </div>
    <div class="topbar-right">
      <span class="user-chip"><i class="fa-solid fa-circle-user"></i> <span id="userNome"></span> <em id="userTipo"></em></span>
      <button id="btnSair" class="btn btn-ghost-light" title="Sair"><i class="fa-solid fa-right-from-bracket"></i><span class="hide-sm"> Sair</span></button>
    </div>
  </header>

  <nav class="tabstrip" id="tabstrip"></nav>

  <main class="workspace" id="workspace"></main>
</div>

<div id="modalBackdrop" class="modal-backdrop hidden">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-head">
      <h3 id="modalTitle"></h3>
      <button class="modal-close" id="modalClose" aria-label="Fechar"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<div id="toasts" class="toasts"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
